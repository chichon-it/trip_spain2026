        let state = {
            expandedDay: null,
            expandedCategories: {}
        };

        function saveState() {
            localStorage.setItem('viaje-agenda-state', JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem('viaje-agenda-state');
            if (saved) state = JSON.parse(saved);
        }

        function updateStats() {
            let total = 0, completed = 0;
            data.forEach(day => {
                day.categories.forEach(cat => {
                    cat.tasks.forEach(task => {
                        total++;
                        if (task.completed) completed++;
                    });
                });
            });
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-completed').textContent = completed;
            document.getElementById('stat-progress').textContent = Math.round((completed / total) * 100) + '%';
        }

        function toggleDay(dayId) {
            state.expandedDay = state.expandedDay === dayId ? null : dayId;
            saveState();
            render();
        }

        function toggleCategory(catKey) {
            state.expandedCategories[catKey] = !state.expandedCategories[catKey];
            saveState();
            render();
        }

        function updateTask(dayId, catId, taskId, field, value) {
            const day = data.find(d => d.id === dayId);
            const cat = day.categories.find(c => c.id === catId);
            const task = cat.tasks.find(t => t.id === taskId);
            task[field] = value;
            saveState();
            updateStats();
        }

        function toggleTask(dayId, catId, taskId) {
            const day = data.find(d => d.id === dayId);
            const cat = day.categories.find(c => c.id === catId);
            const task = cat.tasks.find(t => t.id === taskId);
            task.completed = !task.completed;
            saveState();
            updateStats();
        }

        function deleteTask(dayId, catId, taskId) {
            const day = data.find(d => d.id === dayId);
            const cat = day.categories.find(c => c.id === catId);
            cat.tasks = cat.tasks.filter(t => t.id !== taskId);
            saveState();
            updateStats();
            render();
        }

        function render() {
            const container = document.getElementById('days-container');
            container.innerHTML = '';

            data.forEach(day => {
                const dayCard = document.createElement('div');
                dayCard.className = 'day-card' + (state.expandedDay === day.id ? ' expanded' : '');

                const header = document.createElement('div');
                header.className = 'day-header';
                header.onclick = () => toggleDay(day.id);

                const dayInfo = document.createElement('div');
                dayInfo.className = 'day-info';
                dayInfo.innerHTML = `
                    <div class="day-title">${day.title}</div>
                    <div class="day-dates">${day.date} • ${day.location}</div>
                `;

                const progress = calculateDayProgress(day);
                const progressDiv = document.createElement('div');
                progressDiv.className = 'day-progress';
                progressDiv.innerHTML = `
                    <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
                    <span style="font-size: 12px; color: #999;">${progress}%</span>
                    <div class="chevron">▼</div>
                `;

                header.appendChild(dayInfo);
                header.appendChild(progressDiv);
                dayCard.appendChild(header);

                if (state.expandedDay === day.id) {
                    const content = document.createElement('div');
                    content.className = 'day-content';

                    day.categories.forEach(cat => {
                        const catDiv = document.createElement('div');
                        catDiv.className = 'category' + (state.expandedCategories[`${day.id}-${cat.id}`] ? ' expanded' : '');

                        const catHeader = document.createElement('div');
                        catHeader.className = 'category-header';
                        catHeader.onclick = () => toggleCategory(`${day.id}-${cat.id}`);

                        const completed = cat.tasks.filter(t => t.completed).length;
                        catHeader.innerHTML = `
                            <div class="category-title">
                                <span class="category-icon">${cat.icon}</span>
                                <span class="category-name">${cat.name}</span>
                            </div>
                            <span class="category-count">${completed}/${cat.tasks.length}</span>
                        `;

                        catDiv.appendChild(catHeader);

                        if (state.expandedCategories[`${day.id}-${cat.id}`]) {
                            const taskList = document.createElement('div');
                            taskList.className = 'task-list';

                            cat.tasks.forEach(task => {
                                const taskDiv = document.createElement('div');
                                taskDiv.className = 'task-item';
                                taskDiv.innerHTML = `
                                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${day.id}', '${cat.id}', '${task.id}')">
                                    <div class="task-content">
                                        <input type="text" class="${task.completed ? 'completed' : ''}" value="${task.title}" onchange="updateTask('${day.id}', '${cat.id}', '${task.id}', 'title', this.value)">
                                        ${task.details ? `<textarea onchange="updateTask('${day.id}', '${cat.id}', '${task.id}', 'details', this.value)">${task.details}</textarea>` : ''}
                                    </div>
                                    <div class="task-actions">
                                        <button class="btn-delete" onclick="deleteTask('${day.id}', '${cat.id}', '${task.id}')">✕</button>
                                    </div>
                                `;
                                taskList.appendChild(taskDiv);
                            });

                            catDiv.appendChild(taskList);
                        }

                        content.appendChild(catDiv);
                    });

                    dayCard.appendChild(content);
                }

                container.appendChild(dayCard);
            });
        }

        function calculateDayProgress(day) {
            let total = 0, completed = 0;
            day.categories.forEach(cat => {
                cat.tasks.forEach(task => {
                    total++;
                    if (task.completed) completed++;
                });
            });
            return total > 0 ? Math.round((completed / total) * 100) : 0;
        }

        loadState();
        updateStats();
        render();
    </script>
